name: OSS Governance

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/requirements.txt"
      - "**/pyproject.toml"
      - "**/go.mod"
      - "**/go.sum"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pom.xml"
      - "**/build.gradle*"
      - "**/libs.versions.toml"
      - "scripts/oss/**"
      - ".cursor/**"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  oss-scan:
    name: Dependency & License Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Run OSV scanner
        run: osv-scanner --recursive . || true
        continue-on-error: true

      - name: Run project scan script
        run: bash scripts/oss/scan-deps.sh

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json exists)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate CycloneDX SBOM (Node)
        if: hashFiles('package.json') != ''
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file bom.json || echo "SBOM generation skipped"
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('bom.json') != ''
        with:
          name: sbom-cyclonedx
          path: bom.json
          retention-days: 90

  jira-sync:
    name: Register blocked OSS findings in Jira
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      # Repository secrets / variables. The job is a no-op until JIRA_API_TOKEN is set.
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
      JIRA_ISSUE_TYPE: ${{ vars.JIRA_ISSUE_TYPE || 'Task' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exception review -> Jira (Blocked / CRITICAL only, deduplicated)
        run: |
          if [ -z "$JIRA_API_TOKEN" ] || [ -z "$JIRA_PROJECT" ]; then
            echo "Jira secrets / JIRA_PROJECT not set: skipping"; exit 0
          fi
          rc=0; python3 scripts/oss/exception-review.py . --json > findings.json || rc=$?
          if [ "$rc" -ge 3 ]; then echo "No package.json / requirements.txt: nothing to register"; exit 0; fi
          python3 scripts/oss/jira-issue.py --from findings.json --min-severity block --label oss-ci

  sbom-python:
    name: Generate SBOM (Python)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate CycloneDX SBOM (Python)
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          python -m pip install --quiet cyclonedx-bom
          bash scripts/oss/sbom-python.sh . bom-python.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('bom-python.json') != ''
        with:
          name: sbom-cyclonedx-python
          path: bom-python.json
          retention-days: 90
